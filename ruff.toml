target-version = "py314"
required-version = "==0.15.6"
line-length = 80
indent-width = 4
src = ["src", "tests"]


show-fixes = true
respect-gitignore = true
force-exclude = true

extend-exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pytest_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[lint]
preview = true
extend-unsafe-fixes = ["ALL"]

select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DOC",  # pydoclint
  "DTZ",  # timezone-aware datetime usage
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "ERA",  # commented-out code
  "EXE",  # executable/shebang checks
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "G",    # logging format/style
  "I",    # isort
  "ICN",  # import conventions
  "INP",  # no implicit namespace packages
  "ISC",  # implicit string concat
  "LOG",  # logging usage
  "N",    # pep8-naming
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint (ruff subset)
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib over os.path
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # private member access
  "T20",  # print/pprint
  "TC",   # flake8-type-checking
  "TD",   # todo hygiene
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "YTT",  # flake8-2020
  "FURB", # refurb
]

ignore = [
  # pydocstyle + google convention conflict pair
  "D203",
  "D212",
  
  # I'm the only coder right now, so we can ignore author and issues for TODO
  "TD002",
  "TD003",
]

fixable = ["ALL"]
unfixable = ["F401"]

dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|unused(_[a-zA-Z0-9_]+)?)$"
task-tags = ["TODO", "FIXME", "HACK", "TODO:"]

[lint.pydocstyle]
convention = "google"
ignore-var-parameters = false

[lint.pydoclint]
ignore-one-line-docstrings = false

[lint.pycodestyle]
max-line-length = 80
max-doc-length = 80
ignore-overlong-task-comments = false

[lint.mccabe]
max-complexity = 5

[lint.pylint]
max-args = 4
max-positional-args = 3
max-branches = 8
max-bool-expr = 3
max-locals = 10
max-nested-blocks = 3
max-public-methods = 10
max-returns = 3
max-statements = 10
allow-magic-value-types = ["str"]

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = true
suppress-none-returning = false

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-builtins]
strict-checking = true

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"
raises-require-match-for = [
  "BaseException",
  "Exception",
  "ValueError",
  "OSError",
  "IOError",
  "EnvironmentError",
  "socket.error",
]
warns-require-match-for = [
  "Warning",
  "UserWarning",
  "DeprecationWarning",
]

[lint.flake8-type-checking]
strict = true
quote-annotations = true
exempt-modules = ["typing", "typing_extensions"]

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Avoid cast(); narrow with control flow, overloads, TypeGuard, or better types."
"datetime.datetime.utcnow".msg = "Use timezone-aware datetime.now(UTC)."
"datetime.datetime.now".msg = "Prefer explicit timezone-aware datetimes."

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true
split-on-trailing-comma = true
lines-after-imports = 2

[lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # pytest assert
]

[lint.flake8-implicit-str-concat]
allow-multiline = false

[lint.ruff]
parenthesize-tuple-in-subscript = true


[format]
preview = false
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
