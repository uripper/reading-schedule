target-version = "py314"
line-length = 80
indent-width = 4
src = ["src", "tests"]

preview = true
show-fixes = true
respect-gitignore = true
force-exclude = true

extend-exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pytest_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[lint]
preview = true


select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # timezone-aware datetime usage
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "ERA",  # commented-out code
  "EXE",  # executable/shebang checks
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "G",    # logging format/style
  "I",    # isort
  "ICN",  # import conventions
  "ISC",  # implicit string concat
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint (ruff subset)
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib over os.path
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RUF",  # ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # private member access
  "T20",  # print/pprint
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "YTT",  # flake8-2020
]

ignore = [
  # Conflicting docstring styles; keep the "Google" convention and 
  # let pydocstyle decide.
  "D203",
  "D212",

]

fixable = ["ALL"]
unfixable = ["F401"]

# Treat underscore-prefixed names and "unused_*" as intentionally unused.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|unused(_[a-zA-Z0-9_]+)?)$"

[lint.pydocstyle]
convention = "google"
ignore-var-parameters = false

[lint.pycodestyle]
max-line-length = 80
max-doc-length = 80

[lint.mccabe]
max-complexity = 6

[lint.pylint]
max-args = 5
max-positional-args = 6
max-branches = 10
max-bool-expr = 4
max-locals = 12
max-nested-blocks = 4
max-public-methods = 15
max-returns = 4
max-statements = 40

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = true
suppress-none-returning = false

[lint.flake8-builtins]
strict-checking = true

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

[lint.flake8-type-checking]
strict = true
quote-annotations = true
exempt-modules = ["typing", "typing_extensions"]

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true
split-on-trailing-comma = true

[format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
