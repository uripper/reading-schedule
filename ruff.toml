target-version = "py310"
line-length = 80
src = ["src", "tests"]

[lint]
select = [
  "A",   # flake8-builtins
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "EM",  # flake8-errmsg
  "F",   # pyflakes
  "FA",  # flake8-future-annotations
  "I",   # isort
  "N",   # pep8-naming
  "PERF",# perflint
  "PIE", # flake8-pie
  "PL",  # pylint (ruff subset)
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "TRY", # tryceratops
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  # Keep one docstring style on class/function declarations.
  "D203",
  "D213",
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false

[lint.flake8-quotes]
inline-quotes = "double"

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[lint.per-file-ignores]
"tests/**/*.py" = [
  # Keep idiomatic test assertions enabled.
  "S101",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
