cognitive-complexity-threshold = 5
too-many-arguments-threshold = 3
too-many-lines-threshold = 20

type-complexity-threshold = 100
single-char-binding-names-threshold = 1
excessive-nesting-threshold = 2
enum-variant-name-threshold = 2

check-private-items = true

disallowed-names = [
    "tmp",
    "temp",
    "thing",
    "stuff",
    "foo1",
    "foo2",
    "bar1",
    "bar2",
    "..",
]

disallowed-macros = [
    { path = "std::dbg", reason = "No debug leftovers in committed code" },
    { path = "std::println", reason = "Prefer tracing/logging or explicit IO boundaries" },
    { path = "std::eprintln", reason = "Prefer tracing/logging or explicit IO boundaries" },
]

allow-print-in-tests = false
allow-unwrap-in-tests = false
allow-expect-in-tests = false
allow-panic-in-tests = false
allow-indexing-slicing-in-tests = false
allow-exact-repetitions = false

source-item-ordering = ["enum", "impl", "module", "struct", "trait"]
trait-assoc-item-kinds-order = ["const", "type", "fn"]

allow-mixed-uninlined-format-args = false
allow-one-hash-in-raw-strings = false

doc-valid-idents = [
    "API",
    "APIs",
    "CLI",
    "CPU",
    "CPUs",
    "GPU",
    "GPUs",
    "HTTP",
    "HTTPS",
    "ID",
    "IDs",
    "JSON",
    "SQL",
    "TLS",
    "URL",
    "URLs",
    "UUID",
    "UTF-8",
    "JavaScript",
    "TypeScript",
    "Rust",
    "HTML",
    "CSS",
    "TOML",
    "YAML",
    "..",
]
disallowed-types = ["std::collections::BTreeMap"]
msrv = "1.94.0"
