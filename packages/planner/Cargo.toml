[package]
name = "bartleby_planner"
version = "0.1.0"
edition = "2021"
description = "Shared Bartleby scheduling core for desktop and browser hosts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "=0.4.45", features = ["clock"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.24.0", features = ["v4", "js"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true

