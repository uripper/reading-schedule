[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bartleby-Reading_Plan_Generator"
version = "0.1.0"
description = "Daily reading plans and tracking."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "ortools>=9.10",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.4",
    "ty>=0.0.20",
    "uvicorn>=0.30",
    "vulture>=2.15",
]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pytest>=8.0",
    "ruff>=0.6.0",
    "ty>=0.0.19",
    "radon>=6.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.deptry]
known_first_party = ["reading_plan"]
