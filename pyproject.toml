[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-plan-optimizer"
version = "0.1.0"
description = "Generate daily reading schedules from backlog and time budgets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mip = ["ortools>=9.10"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
reading-plan = "reading_plan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "UP",
  "W",
]
ignore = [
  # Backlog: existing code lacks complete module/class/function doc coverage.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
