[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-plan-optimizer"
version = "0.1.0"
description = "Generate daily reading schedules from backlog and time budgets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mip = ["ortools>=9.10"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
reading-plan = "reading_plan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
