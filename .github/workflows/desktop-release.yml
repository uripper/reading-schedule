name: Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - apps/bartleby/package.json
      - apps/bartleby/src-tauri/Cargo.lock
      - apps/bartleby/src-tauri/Cargo.toml
      - apps/website/package.json
      - packages/contracts/package.json
      - packages/frontend/package.json
      - packages/planner/**
      - pnpm-lock.yaml
      - scripts/check-dependency-versions.mjs

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect desktop version change
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify centralized version
        run: node ./scripts/set-app-version.mjs --check

      - name: Verify dependency alignment
        run: node ./scripts/check-dependency-versions.mjs

      - name: Compare desktop versions
        id: version
        shell: bash
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_VERSION="$(
            git show "${PREVIOUS_COMMIT}:package.json" |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          )"
          echo "current=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${CURRENT_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Desktop version is unchanged at ${CURRENT_VERSION}; skipping release."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "Desktop version changed from ${PREVIOUS_VERSION} to ${CURRENT_VERSION}."

      - name: Read desktop release notes
        id: notes
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          NOTES="$(node ./scripts/release-notes.mjs print desktop "${RELEASE_VERSION}")"
          {
            echo "notes<<BARTLEBY_RELEASE_NOTES_EOF"
            echo "${NOTES}"
            echo "BARTLEBY_RELEASE_NOTES_EOF"
          } >> "${GITHUB_OUTPUT}"

  validate-desktop:
    name: Validate desktop release
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/bartleby/src-tauri -> target
            packages/planner -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop release
        run: |
          pnpm run typecheck:desktop
          pnpm run build:desktop
          pnpm run test:desktop
          cargo clippy --locked --manifest-path packages/planner/Cargo.toml -- -D warnings
          cargo clippy --locked \
            --manifest-path apps/bartleby/src-tauri/Cargo.toml \
            -- -D warnings

  # Creates the one draft every platform build uploads into. Letting each
  # matrix job create its own draft races: parallel jobs that finish together
  # each create a separate draft, splitting assets and latest.json between them.
  create-release:
    name: Create draft release
    needs:
      - detect-version
      - validate-desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.BARTLEBY_RELEASE_TOKEN }}
      RELEASE_NOTES: ${{ needs.detect-version.outputs.notes }}
      RELEASE_TAG: Bartleby-v${{ needs.detect-version.outputs.current }}
      RELEASE_VERSION: ${{ needs.detect-version.outputs.current }}

    steps:
      - name: Create or reuse draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(
            gh api --paginate repos/uripper/Bartleby/releases \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | {id, draft}"
          )"
          if jq --exit-status --slurp 'any(.draft == false)' <<< "${MATCHES}" > /dev/null; then
            echo "::error::${RELEASE_TAG} is already published; bump the version instead."
            exit 1
          fi
          DRAFT_COUNT="$(jq --slurp 'length' <<< "${MATCHES}")"
          if (( DRAFT_COUNT > 1 )); then
            echo "::error::Found ${DRAFT_COUNT} drafts for ${RELEASE_TAG} in uripper/Bartleby; delete them and re-run."
            exit 1
          fi
          if (( DRAFT_COUNT == 1 )); then
            RELEASE_ID="$(jq --slurp '.[0].id' <<< "${MATCHES}")"
            echo "Reusing draft release ${RELEASE_ID} for ${RELEASE_TAG}."
          else
            RELEASE_ID="$(
              gh api repos/uripper/Bartleby/releases \
                -f tag_name="${RELEASE_TAG}" \
                -f target_commitish=main \
                -f name="Bartleby ${RELEASE_VERSION}" \
                -f body="${RELEASE_NOTES}" \
                -F draft=true \
                -F prerelease=false \
                --jq '.id'
            )"
            echo "Created draft release ${RELEASE_ID} for ${RELEASE_TAG}."
          fi
          echo "id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

  release-desktop:
    name: Release ${{ matrix.label }}
    needs:
      - create-release
      - detect-version
      - validate-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rust_target: ""
            args: --bundles nsis -- --locked
            asset_name: Bartleby.Setup[ext]
            apple_signing_identity: ""
          - label: macOS Apple Silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin -- --locked
            asset_name: Bartleby.[arch][ext]
            apple_signing_identity: "-"
          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin -- --locked
            asset_name: Bartleby.[arch][ext]
            apple_signing_identity: "-"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/bartleby/src-tauri -> target
            packages/planner -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uploads installers and updater signatures only. latest.json is built
      # once in publish-release, after every platform has uploaded, because
      # parallel jobs merging into it can overwrite each other's entries.
      - name: Build signed update into draft release
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          GITHUB_TOKEN: ${{ secrets.BARTLEBY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}
          owner: uripper
          projectPath: apps/bartleby
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          releaseId: ${{ needs.create-release.outputs.id }}
          repo: Bartleby
          retryAttempts: 2
          tauriScript: pnpm tauri
          uploadUpdaterJson: false

  publish-release:
    name: Publish complete desktop update
    needs:
      - create-release
      - detect-version
      - release-desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.BARTLEBY_RELEASE_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
      RELEASE_NOTES: ${{ needs.detect-version.outputs.notes }}
      RELEASE_VERSION: ${{ needs.detect-version.outputs.current }}

    steps:
      # Each updater platform maps to the tarball/installer tauri-action
      # uploads for it; the matching .sig asset holds its signature. Asset API
      # URLs match what tauri-action writes and work for draft releases.
      - name: Build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="${RUNNER_TEMP}/bartleby-release"
          mkdir -p "${WORK_DIR}"
          gh api "repos/uripper/Bartleby/releases/${RELEASE_ID}/assets" \
            --paginate > "${WORK_DIR}/assets.json"
          PLATFORMS='{}'
          while read -r ASSET_NAME PLATFORM_KEYS; do
            ASSET_URL="$(
              jq --raw-output --arg name "${ASSET_NAME}" \
                '.[] | select(.name == $name) | .url' "${WORK_DIR}/assets.json"
            )"
            SIGNATURE_ID="$(
              jq --raw-output --arg name "${ASSET_NAME}.sig" \
                '.[] | select(.name == $name) | .id' "${WORK_DIR}/assets.json"
            )"
            if [[ -z "${ASSET_URL}" || -z "${SIGNATURE_ID}" ]]; then
              echo "::error::Draft ${RELEASE_ID} is missing ${ASSET_NAME} or its .sig."
              exit 1
            fi
            SIGNATURE="$(
              gh api -H "Accept: application/octet-stream" \
                "repos/uripper/Bartleby/releases/assets/${SIGNATURE_ID}"
            )"
            for PLATFORM_KEY in ${PLATFORM_KEYS}; do
              PLATFORMS="$(
                jq --arg key "${PLATFORM_KEY}" --arg url "${ASSET_URL}" \
                  --arg signature "${SIGNATURE}" \
                  '.[$key] = {signature: $signature, url: $url}' <<< "${PLATFORMS}"
              )"
            done
          done <<'BARTLEBY_UPDATER_ASSETS'
          Bartleby.Setup.exe windows-x86_64 windows-x86_64-nsis
          Bartleby.aarch64.app.tar.gz darwin-aarch64 darwin-aarch64-app
          Bartleby.x64.app.tar.gz darwin-x86_64 darwin-x86_64-app
          BARTLEBY_UPDATER_ASSETS
          jq --null-input \
            --arg version "${RELEASE_VERSION}" \
            --arg notes "${RELEASE_NOTES}" \
            --arg pubDate "$(date --utc +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson platforms "${PLATFORMS}" \
            '{version: $version, notes: $notes, pub_date: $pubDate, platforms: $platforms}' \
            > "${WORK_DIR}/latest.json"

      - name: Verify updater platforms
        shell: bash
        run: |
          set -euo pipefail
          jq --exit-status \
            --arg version "${RELEASE_VERSION}" \
            '
              .version == $version
              and (.platforms["windows-x86_64"].url | length > 0)
              and (.platforms["windows-x86_64"].signature | length > 0)
              and (.platforms["darwin-aarch64"].url | length > 0)
              and (.platforms["darwin-aarch64"].signature | length > 0)
              and (.platforms["darwin-x86_64"].url | length > 0)
              and (.platforms["darwin-x86_64"].signature | length > 0)
            ' \
            "${RUNNER_TEMP}/bartleby-release/latest.json"

      - name: Upload updater manifest
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_ID="$(
            gh api "repos/uripper/Bartleby/releases/${RELEASE_ID}/assets" \
              --paginate --jq '.[] | select(.name == "latest.json") | .id'
          )"
          if [[ -n "${EXISTING_ID}" ]]; then
            gh api -X DELETE "repos/uripper/Bartleby/releases/assets/${EXISTING_ID}"
          fi
          gh api -X POST \
            -H "Content-Type: application/json" \
            --input "${RUNNER_TEMP}/bartleby-release/latest.json" \
            "https://uploads.github.com/repos/uripper/Bartleby/releases/${RELEASE_ID}/assets?name=latest.json"

      - name: Publish latest release
        run: |
          gh api -X PATCH "repos/uripper/Bartleby/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --silent
